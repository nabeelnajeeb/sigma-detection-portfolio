title: Suspicious Local Account Discovery Command Execution
id: 11271c7a-190b-4cd7-bbeb-1d5b35d22a25
status: experimental
description: Detects whoami/net/net1 execution from an atypical parent process (accessibility tools, known privilege-escalation tools) or from a non-interactive service account context, rather than a normal interactive shell.
author: Nabeel Najeeb
date: 2026-08-12
logsource:
    category: process_creation
    product: windows
detection:
    selection_commands:
        Image|endswith:
            - '\whoami.exe'
            - '\net.exe'
            - '\net1.exe'
    selection_suspicious_parent:
        ParentImage|endswith:
            - '\osk.exe'
            - '\EfsPotato.exe'
    selection_suspicious_user:
        User|contains: 'APPPOOL'
    condition: selection_commands and (selection_suspicious_parent or selection_suspicious_user)
falsepositives:
    - Legitimate accessibility tool customisation scripts or administrative tooling running under a service account
level: medium
tags:
    - attack.discovery
    - attack.t1033
    - attack.t1087.001
